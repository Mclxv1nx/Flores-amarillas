<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#bfe4f6">
<meta name="description" content="Jardín de flores amarillas dibujado en canvas: cielo, nubes, brote, viento y corte vertical del suelo con raíces.">
<title>Jardín de Raíces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#bfe4f6;overscroll-behavior:none}
  body{
    font-family:"Fraunces",Georgia,"Times New Roman",serif;
    color:#2f4633;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  #scene{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:crosshair;
  }
  .hud{
    position:fixed;left:0;right:0;bottom:0;
    padding:0 18px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    pointer-events:none;
  }
  .mark{
    pointer-events:none;
    font-size:13px;line-height:1.35;font-weight:300;letter-spacing:.02em;
    color:#f2ead3;text-shadow:0 1px 3px rgba(20,12,6,.55);
  }
  .mark b{display:block;font-weight:500;font-size:16px;letter-spacing:.01em}
  .hint{
    pointer-events:none;
    font-size:12px;letter-spacing:.09em;text-transform:uppercase;
    color:rgba(242,234,211,.82);text-shadow:0 1px 3px rgba(20,12,6,.6);
    transition:opacity .8s ease;white-space:nowrap;
  }
  .hint.gone{opacity:0}
  .btn{
    pointer-events:auto;
    font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:#f6efd9;background:rgba(58,38,24,.42);
    border:1px solid rgba(246,239,217,.35);border-radius:999px;
    padding:9px 16px;cursor:pointer;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:background .25s ease,transform .15s ease;
  }
  .btn:hover{background:rgba(58,38,24,.62)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid #ffd23f;outline-offset:3px}
  @media (max-width:420px){ .mark b{font-size:14px} .mark span{display:none} }
</style>
</head>
<body>
<canvas id="scene" aria-label="Jardín animado de flores amarillas con raíces visibles bajo tierra"></canvas>

<div class="hud">
  <p class="mark"><b>Jardín de Raíces</b><span>corte vertical · flores amarillas</span></p>
  <p class="hint" id="hint">toca la tierra para sembrar</p>
  <button class="btn" id="replant" type="button">Resembrar</button>
</div>

<script>
(() => {
  "use strict";

  const cv  = document.getElementById('scene');
  const ctx = cv.getContext('2d', { alpha: false });
  const hintEl = document.getElementById('hint');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------------------------------------------------------- utils */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp  = (a, b, t) => a + (b - a) * t;
  const easeOut  = t => 1 - Math.pow(1 - t, 3);
  const easeBack = t => { const c = 1.70158 + 1; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // deterministic pseudo-random per flower, so a plant keeps its identity
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }

  /* ------------------------------------------------------------- palette */
  const P = {
    skyTop:  '#79c3ea', skyMid: '#a8dcf4', skyLow: '#dff1fb',
    sun:     '#fff6cf',
    hillFar: '#b9d7b0', hillNear: '#9ac489',
    grassLo: '#3f6f34', grassHi: '#7cb04b', grassTip: '#a8cf63',
    soilTop: '#6f4d31', soilMid: '#5a3c27', soilDeep: '#3d281a', soilFloor: '#2a1a11',
    root:    '#efe2c3', rootThin: '#ded0ab',
    petalDeep: '#e9a712', petalMid: '#ffcb21', petalHi: '#fff1a6',
    heart:   '#5d3d1c', heartHi: '#8a5f2c',
    stem:    '#4c7f36', stemHi: '#79ad48'
  };

  /* ------------------------------------------------------------- state */
  let W = 0, H = 0, DPR = 1, groundY = 0, soilH = 0;
  let bg = document.createElement('canvas');
  let bgx = bg.getContext('2d');
  let clouds = [], grassBack = [], grassFront = [], flowers = [], motes = [];
  let t0 = performance.now();

  /* ------------------------------------------------- static background */
  function paintBackground() {
    bg.width = Math.floor(W * DPR);
    bg.height = Math.floor(H * DPR);
    bgx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgx.clearRect(0, 0, W, H);

    // sky
    const sky = bgx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0,    P.skyTop);
    sky.addColorStop(0.55, P.skyMid);
    sky.addColorStop(1,    P.skyLow);
    bgx.fillStyle = sky;
    bgx.fillRect(0, 0, W, groundY + 1);

    // sun haze, upper right
    const sx = W * 0.82, sy = groundY * 0.2, sr = Math.max(W, H) * 0.42;
    const glow = bgx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    glow.addColorStop(0,   'rgba(255,248,214,.95)');
    glow.addColorStop(.18, 'rgba(255,246,205,.45)');
    glow.addColorStop(.55, 'rgba(255,244,200,.12)');
    glow.addColorStop(1,   'rgba(255,244,200,0)');
    bgx.fillStyle = glow;
    bgx.fillRect(0, 0, W, groundY + 1);
    bgx.fillStyle = P.sun;
    bgx.beginPath(); bgx.arc(sx, sy, Math.min(W, H) * 0.055, 0, TAU); bgx.fill();

    // distant hills
    const r = rng(20260921);
    for (let layer = 0; layer < 2; layer++) {
      const amp  = (layer === 0 ? 0.055 : 0.035) * H;
      const base = groundY - (layer === 0 ? H * 0.028 : 0);
      bgx.beginPath();
      bgx.moveTo(-10, base + 20);
      for (let x = -10; x <= W + 10; x += 14) {
        const y = base - amp * (0.55 + 0.45 * Math.sin(x * 0.0042 + layer * 2.1 + r() * 0.02))
                       - amp * 0.35 * Math.sin(x * 0.011 + layer);
        bgx.lineTo(x, y);
      }
      bgx.lineTo(W + 10, base + 20); bgx.closePath();
      bgx.fillStyle = layer === 0 ? P.hillFar : P.hillNear;
      bgx.globalAlpha = layer === 0 ? 0.65 : 0.9;
      bgx.fill();
    }
    bgx.globalAlpha = 1;

    /* ------- vertical cross-section of the earth ------- */
    const soil = bgx.createLinearGradient(0, groundY, 0, H);
    soil.addColorStop(0,    P.soilTop);
    soil.addColorStop(0.18, '#63442c');
    soil.addColorStop(0.45, P.soilMid);
    soil.addColorStop(0.78, P.soilDeep);
    soil.addColorStop(1,    P.soilFloor);
    bgx.fillStyle = soil;
    bgx.fillRect(0, groundY, W, H - groundY + 1);

    // strata: soft wavy bands so the cut reads as layered ground
    const bands = 5;
    for (let i = 1; i <= bands; i++) {
      const yy = groundY + soilH * (i / (bands + 0.6)) + (r() - .5) * 8;
      bgx.beginPath();
      bgx.moveTo(0, yy);
      for (let x = 0; x <= W; x += 18) {
        bgx.lineTo(x, yy + Math.sin(x * 0.006 + i * 1.7) * 4 + Math.sin(x * 0.021 + i) * 2);
      }
      bgx.strokeStyle = i % 2 ? 'rgba(255,225,185,.055)' : 'rgba(20,10,4,.10)';
      bgx.lineWidth = 6 + i * 2;
      bgx.stroke();
    }

    // grit
    const grit = Math.floor((W * soilH) / 620);
    for (let i = 0; i < grit; i++) {
      const x = r() * W, y = groundY + Math.pow(r(), 0.75) * soilH;
      const a = 0.05 + r() * 0.16;
      bgx.fillStyle = r() > 0.45 ? `rgba(255,222,176,${a})` : `rgba(28,15,6,${a + .08})`;
      bgx.fillRect(x, y, 1 + r() * 1.8, 1 + r() * 1.4);
    }

    // pebbles
    const pebbles = Math.floor((W * soilH) / 12000) + 6;
    for (let i = 0; i < pebbles; i++) {
      const x = r() * W, y = groundY + 18 + r() * (soilH - 26), rad = 2.4 + r() * 6;
      bgx.save(); bgx.translate(x, y); bgx.rotate(r() * TAU); bgx.scale(1, 0.68);
      const g = bgx.createRadialGradient(-rad * .3, -rad * .3, rad * .1, 0, 0, rad);
      g.addColorStop(0, 'rgba(186,170,150,.75)');
      g.addColorStop(1, 'rgba(96,80,66,.55)');
      bgx.fillStyle = g;
      bgx.beginPath(); bgx.arc(0, 0, rad, 0, TAU); bgx.fill();
      bgx.restore();
    }

    // dark topsoil lip right under the turf
    const lip = bgx.createLinearGradient(0, groundY - 2, 0, groundY + 26);
    lip.addColorStop(0, 'rgba(30,18,8,.55)');
    lip.addColorStop(1, 'rgba(30,18,8,0)');
    bgx.fillStyle = lip;
    bgx.fillRect(0, groundY - 2, W, 28);

    // turf band sitting on the cut
    const turf = bgx.createLinearGradient(0, groundY - 13, 0, groundY + 4);
    turf.addColorStop(0, P.grassHi);
    turf.addColorStop(1, P.grassLo);
    bgx.fillStyle = turf;
    bgx.beginPath();
    bgx.moveTo(0, groundY + 4);
    for (let x = 0; x <= W; x += 10) {
      bgx.lineTo(x, groundY - 9 + Math.sin(x * 0.05) * 1.6 + Math.sin(x * 0.013) * 2.2);
    }
    bgx.lineTo(W, groundY + 4);
    bgx.closePath(); bgx.fill();
  }

  /* ---------------------------------------------------------- clouds */
  function makeCloud(seed) {
    const r = rng(seed);
    const scale = 0.55 + r() * 0.9;
    const puffs = [];
    const n = 5 + Math.floor(r() * 4);
    let wx = 0;
    for (let i = 0; i < n; i++) {
      const rad = (16 + r() * 22) * scale;
      puffs.push({ x: wx, y: (r() - 0.5) * 12 * scale, r: rad });
      wx += rad * (0.62 + r() * 0.3);
    }
    const width = wx + 60 * scale, height = 90 * scale;

    // pre-render once: soft edges are expensive to redraw every frame
    const c = document.createElement('canvas');
    c.width  = Math.ceil((width + 40) * DPR);
    c.height = Math.ceil((height + 40) * DPR);
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.translate(20, height * 0.62);

    for (const p of puffs) {                       // shaded underside
      const rg = g.createRadialGradient(p.x, p.y + p.r * .25, 0, p.x, p.y + p.r * .25, p.r);
      rg.addColorStop(0,  'rgba(197,219,238,.9)');
      rg.addColorStop(.7, 'rgba(197,219,238,.35)');
      rg.addColorStop(1,  'rgba(197,219,238,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(p.x, p.y + p.r * .22, p.r, 0, TAU); g.fill();
    }
    for (const p of puffs) {                       // lit body
      const rg = g.createRadialGradient(p.x - p.r * .2, p.y - p.r * .35, p.r * .05, p.x, p.y, p.r);
      rg.addColorStop(0,   'rgba(255,255,255,1)');
      rg.addColorStop(.62, 'rgba(255,255,255,.94)');
      rg.addColorStop(.86, 'rgba(255,255,255,.42)');
      rg.addColorStop(1,   'rgba(255,255,255,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(p.x, p.y - p.r * .06, p.r, 0, TAU); g.fill();
    }

    return {
      img: c, w: width + 40, h: height + 40,
      x: 0, y: 0, speed: (5 + r() * 12) * (0.4 + scale * 0.6),
      alpha: 0.55 + r() * 0.4, depth: scale
    };
  }

  function seedClouds() {
    clouds = [];
    const n = clamp(Math.round(W / 180), 3, 8);
    for (let i = 0; i < n; i++) {
      const c = makeCloud(1000 + i * 977);
      c.x = (W + c.w) * (i / n) - c.w * 0.5 + Math.random() * 60;
      c.y = groundY * (0.06 + 0.52 * (i % 3) / 3) + Math.random() * groundY * 0.1;
      clouds.push(c);
    }
    clouds.sort((a, b) => a.depth - b.depth);
  }

  /* ----------------------------------------------------------- grass */
  function makeBlades(count, minH, maxH, palette, spread) {
    const out = [];
    for (let i = 0; i < count; i++) {
      const x = Math.random() * (W + 40) - 20;
      const h = lerp(minH, maxH, Math.pow(Math.random(), 0.65));
      out.push({
        x, h,
        w: 1.6 + Math.random() * 2.6,
        lean: (Math.random() - 0.5) * h * 0.42,
        phase: Math.random() * TAU,
        stiff: 0.5 + Math.random() * 0.9,
        base: groundY + (Math.random() - 0.4) * spread,
        col: palette[(Math.random() * palette.length) | 0]
      });
    }
    return out.sort((a, b) => a.base - b.base);
  }

  function seedGrass() {
    const dens = clamp(Math.round(W / 4.2), 90, 520);
    grassBack  = makeBlades(Math.round(dens * 0.55), H * 0.018, H * 0.055,
                            ['#3d6b32', '#47773a', '#538544'], 5);
    grassFront = makeBlades(Math.round(dens * 0.45), H * 0.025, H * 0.085,
                            ['#5d9445', '#6fa84a', '#86bb56', '#4d8039'], 9);
  }

  /* --------------------------------------------------------- roots */
  // Roots are generated once as a list of segments with a growth window,
  // so animating them is just a clamp per segment.
  function buildRoots(maxLen, seed) {
    const r = rng(seed);
    const segs = [];
    const grow = (x, y, ang, len, w, depth, t0, t1) => {
      const steps = 4;
      let cx = x, cy = y, a = ang;
      for (let i = 0; i < steps; i++) {
        a += (r() - 0.5) * 0.55 / (depth + 1);
        const sl = len / steps;
        const nx = cx + Math.cos(a) * sl, ny = cy + Math.sin(a) * sl;
        const f0 = t0 + (t1 - t0) * (i / steps), f1 = t0 + (t1 - t0) * ((i + 1) / steps);
        segs.push({
          x0: cx, y0: cy, x1: nx, y1: ny,
          w0: w * (1 - i / steps * 0.28), w1: w * (1 - (i + 1) / steps * 0.28),
          t0: f0, t1: f1, d: depth
        });
        // side hairs on thin roots
        if (depth >= 2 && r() > 0.45) {
          const ha = a + (r() > .5 ? 1 : -1) * (0.7 + r() * 0.7);
          const hl = sl * (0.35 + r() * 0.5);
          segs.push({
            x0: nx, y0: ny, x1: nx + Math.cos(ha) * hl, y1: ny + Math.sin(ha) * hl,
            w0: w * 0.3, w1: w * 0.12, t0: f1, t1: Math.min(1, f1 + 0.06), d: depth + 2
          });
        }
        cx = nx; cy = ny;
      }
      if (depth < 3 && len > maxLen * 0.12) {
        const kids = depth === 0 ? 3 : (r() > 0.35 ? 2 : 1);
        for (let k = 0; k < kids; k++) {
          const spread = (k - (kids - 1) / 2) * (0.5 + r() * 0.45);
          grow(cx, cy, a + spread, len * (0.5 + r() * 0.22), w * 0.55,
               depth + 1, t1 - (t1 - t0) * 0.15, Math.min(1, t1 + (1 - t1) * (0.55 + r() * 0.4)));
        }
      }
      // a mid-branch off the taproot keeps it from looking like a fork
      if (depth === 0) {
        const my = y + len * 0.42;
        grow(x + (r() - .5) * 4, my, (r() > .5 ? 0.6 : Math.PI - 0.6) + (r() - .5) * .4,
             len * 0.45, w * 0.45, 1, t0 + (t1 - t0) * 0.42, 0.9);
      }
    };
    grow(0, 0, Math.PI / 2 + (r() - 0.5) * 0.25, maxLen * 0.62, 5.2, 0, 0, 0.62);
    return segs;
  }

  /* ------------------------------------------------------- flowers */
  const KINDS = ['sunflower', 'tulip', 'lily'];

  function makeFlower(x, delay, seed) {
    const r = rng(seed);
    const kind = KINDS[(r() * KINDS.length) | 0];
    const depth = 0.72 + r() * 0.45;                 // visual depth / scale
    const maxRoot = clamp(soilH * (0.42 + r() * 0.4), 40, soilH * 0.88);
    return {
      x, kind, seed, depth,
      base: groundY + (depth - 1) * 10,
      height: H * (kind === 'sunflower' ? 0.26 : 0.2) * depth * (0.82 + r() * 0.42),
      headR: (kind === 'sunflower' ? 34 : kind === 'lily' ? 28 : 24) * depth * (0.85 + r() * 0.3),
      petals: kind === 'sunflower' ? 13 + ((r() * 5) | 0) : kind === 'lily' ? 6 : 5,
      lean: (r() - 0.5) * 0.34,
      sway: 0.7 + r() * 0.75,
      phase: r() * TAU,
      leafAt: [0.3 + r() * 0.1, 0.55 + r() * 0.12],
      leafSide: r() > 0.5 ? 1 : -1,
      roots: buildRoots(maxRoot, seed ^ 0x9e37),
      delay, t: 0, tint: r()
    };
  }

  function seedFlowers() {
    flowers = [];
    const n = clamp(Math.round(W / 108), 5, 16);
    const slot = W / n;
    for (let i = 0; i < n; i++) {
      const x = slot * (i + 0.5) + (Math.random() - 0.5) * slot * 0.62;
      flowers.push(makeFlower(x, 0.25 + i * 0.28 + Math.random() * 0.3, (i * 7919 + 13) | 0));
    }
    flowers.sort((a, b) => a.depth - b.depth);
  }

  /* ---------------------------------------------------------- wind */
  function windAt(x, t) {
    const lag = t - x * 0.0016;
    return 0.42 * Math.sin(lag * 0.62)
         + 0.26 * Math.sin(lag * 1.31 + 1.7)
         + 0.32 * Math.sin(lag * 0.17) * Math.sin(lag * 0.43 + 0.6);
  }

  /* --------------------------------------------------------- draw */
  function taperedPath(pts, widths) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], n = pts[Math.min(i + 1, pts.length - 1)], q = pts[Math.max(i - 1, 0)];
      const a = Math.atan2(n.y - q.y, n.x - q.x) + Math.PI / 2;
      const w = widths[i] / 2;
      const x = p.x + Math.cos(a) * w, y = p.y + Math.sin(a) * w;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i], n = pts[Math.min(i + 1, pts.length - 1)], q = pts[Math.max(i - 1, 0)];
      const a = Math.atan2(n.y - q.y, n.x - q.x) + Math.PI / 2;
      const w = widths[i] / 2;
      ctx.lineTo(p.x - Math.cos(a) * w, p.y - Math.sin(a) * w);
    }
    ctx.closePath();
  }

  function drawBlade(b, t) {
    const w = windAt(b.x, t) * b.stiff;
    const bend = b.lean + w * b.h * 0.3;
    const pts = [], wd = [];
    const N = 4;
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      pts.push({ x: b.x + bend * s * s + Math.sin(b.phase + s * 1.4) * 1.2 * s, y: b.base - b.h * s });
      wd.push(b.w * (1 - s * 0.92));
    }
    taperedPath(pts, wd);
    ctx.fillStyle = b.col;
    ctx.fill();
  }

  function drawRoots(f, p) {
    if (p <= 0) return;
    ctx.save();
    ctx.translate(f.x, f.base);
    ctx.lineCap = 'round';

    // two passes: a dark halo of disturbed soil, then the root itself
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(24,13,5,.32)' : P.root;
      for (const s of f.roots) {
        if (p <= s.t0) continue;
        const k = clamp((p - s.t0) / Math.max(0.001, s.t1 - s.t0), 0, 1);
        const ex = lerp(s.x0, s.x1, k), ey = lerp(s.y0, s.y1, k);
        if (pass === 1) ctx.strokeStyle = s.d >= 2 ? P.rootThin : P.root;
        ctx.globalAlpha = pass === 0 ? 0.5 : (s.d >= 3 ? 0.55 : 0.95);
        ctx.lineWidth = Math.max(0.5, (s.w0 * f.depth) * (pass === 0 ? 2.4 : 1));
        ctx.beginPath();
        ctx.moveTo(s.x0, s.y0);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawLeaf(x, y, ang, len, wid, t, seed) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang + Math.sin(t * 1.6 + seed) * 0.06);
    const g = ctx.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0, P.stem);
    g.addColorStop(1, P.stemHi);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(wid, -len * 0.22, wid * 0.72, -len * 0.78, 0, -len);
    ctx.bezierCurveTo(-wid * 0.34, -len * 0.7, -wid * 0.42, -len * 0.2, 0, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,60,26,.35)';
    ctx.lineWidth = Math.max(0.6, len * 0.018);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(wid * 0.22, -len * 0.5, 0, -len);
    ctx.stroke();
    ctx.restore();
  }

  function petalPath(len, wid, curl) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(wid, -len * 0.26, wid * 0.68, -len * 0.82, curl, -len);
    ctx.bezierCurveTo(-wid * 0.68, -len * 0.82, -wid, -len * 0.26, 0, 0);
    ctx.closePath();
  }

  function petalFill(len, shift) {
    const g = ctx.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0,   P.petalDeep);
    g.addColorStop(0.42 + shift * 0.1, P.petalMid);
    g.addColorStop(1,   P.petalHi);
    return g;
  }

  function drawHead(f, ang, t, bloom) {
    const s = easeBack(bloom);
    if (s <= 0.001) return;
    const R = f.headR * s;
    ctx.save();
    ctx.rotate(ang + Math.sin(t * 1.1 + f.phase) * 0.05);

    if (f.kind === 'sunflower') {
      const cr = R * 0.42;
      for (let ring = 0; ring < 2; ring++) {
        const n = f.petals - ring * 3;
        const len = R * (ring ? 0.78 : 1);
        for (let i = 0; i < n; i++) {
          ctx.save();
          ctx.rotate(i / n * TAU + (ring ? Math.PI / n : 0) + Math.sin(t * 0.8 + i) * 0.012);
          ctx.translate(0, -cr * 0.75);
          ctx.fillStyle = petalFill(len, ring ? 0.3 : 0);
          ctx.globalAlpha = ring ? 0.92 : 1;
          petalPath(len, R * 0.2, 0);
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
      const hg = ctx.createRadialGradient(-cr * .25, -cr * .3, cr * .08, 0, 0, cr);
      hg.addColorStop(0, P.heartHi);
      hg.addColorStop(1, P.heart);
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(0, 0, cr, 0, TAU); ctx.fill();
      const seeds = Math.round(cr * 2.6);
      ctx.fillStyle = 'rgba(46,28,10,.75)';
      for (let i = 0; i < seeds; i++) {
        const a = i * 2.39996, rr = cr * 0.9 * Math.sqrt(i / seeds);
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, Math.max(0.5, cr * 0.055), 0, TAU);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,220,130,.45)';
      ctx.lineWidth = Math.max(0.7, cr * 0.09);
      ctx.beginPath(); ctx.arc(0, 0, cr * 0.97, 0, TAU); ctx.stroke();

    } else if (f.kind === 'tulip') {
      ctx.translate(0, R * 0.42);
      const back = [-0.62, 0.62], front = [-0.33, 0, 0.33];
      for (const a of back) {
        ctx.save(); ctx.rotate(a);
        ctx.fillStyle = P.petalDeep;
        petalPath(R * 1.35, R * 0.62, 0); ctx.fill();
        ctx.restore();
      }
      for (const a of front) {
        ctx.save(); ctx.rotate(a + Math.sin(t + a) * 0.015);
        ctx.fillStyle = petalFill(R * 1.5, 0.2);
        petalPath(R * 1.5, R * 0.56, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(200,132,12,.28)';
        ctx.lineWidth = Math.max(0.6, R * 0.035);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(233,167,18,.5)';
      ctx.beginPath(); ctx.ellipse(0, 0, R * 0.42, R * 0.18, 0, 0, TAU); ctx.fill();

    } else { // lily
      const n = f.petals, len = R * 1.25;
      for (let layer = 0; layer < 2; layer++) {
        for (let i = 0; i < n / 2; i++) {
          ctx.save();
          ctx.rotate((i / (n / 2)) * TAU + (layer ? TAU / n : 0) + Math.sin(t * 0.9 + i) * 0.02);
          ctx.translate(0, -R * 0.12);
          ctx.fillStyle = petalFill(len * (layer ? 0.88 : 1), layer * 0.25);
          ctx.globalAlpha = layer ? 0.95 : 1;
          petalPath(len * (layer ? 0.88 : 1), R * 0.3, (i % 2 ? 1 : -1) * R * 0.12);
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + 0.4, L = R * 0.72;
        ctx.strokeStyle = 'rgba(214,154,32,.85)';
        ctx.lineWidth = Math.max(0.7, R * 0.05);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * L, Math.sin(a) * L); ctx.stroke();
        ctx.fillStyle = '#c96a1e';
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * L, Math.sin(a) * L, R * 0.1, R * 0.055, a, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#f7d558';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.16, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawFlower(f, t) {
    const p = clamp(f.t, 0, 1);
    if (p <= 0) return;
    const rootP = easeOut(clamp(p / 0.55, 0, 1));
    const stemP = easeOut(clamp((p - 0.16) / 0.52, 0, 1));
    const leafP = easeOut(clamp((p - 0.42) / 0.3, 0, 1));
    const bloom = clamp((p - 0.66) / 0.34, 0, 1);

    drawRoots(f, rootP);
    if (stemP <= 0) return;

    const w = windAt(f.x, t) * f.sway;
    const h = f.height * stemP;
    const N = 8, pts = [], wd = [];
    const baseW = 4.4 * f.depth;
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const bendX = (f.lean + w * 0.42) * s * s * f.height * 0.55;
      pts.push({ x: f.x + bendX, y: f.base - h * s });
      wd.push(baseW * (1 - s * 0.45));
    }
    taperedPath(pts, wd);
    const sg = ctx.createLinearGradient(f.x - 4, 0, f.x + 4, 0);
    sg.addColorStop(0, P.stem);
    sg.addColorStop(0.55, P.stemHi);
    sg.addColorStop(1, '#3e6b2c');
    ctx.fillStyle = sg;
    ctx.fill();

    // leaves
    if (leafP > 0) {
      f.leafAt.forEach((at, i) => {
        if (stemP < at) return;
        const idx = clamp(Math.round(at * N), 0, N);
        const pt = pts[idx];
        const side = f.leafSide * (i % 2 ? -1 : 1);
        const len = f.height * (0.3 - i * 0.05) * leafP;
        drawLeaf(pt.x, pt.y, side * (1.1 + w * 0.16) + (side > 0 ? 0 : 0),
                 len, len * 0.36 * side, t, f.phase + i);
      });
    }

    // head
    const tip = pts[N], prev = pts[N - 1];
    const ang = Math.atan2(tip.x - prev.x, -(tip.y - prev.y));
    ctx.save();
    ctx.translate(tip.x, tip.y);
    drawHead(f, ang, t, bloom);
    ctx.restore();
  }

  /* ---------------------------------------------------------- motes */
  function seedMotes() {
    motes = [];
    const n = clamp(Math.round(W / 26), 12, 60);
    for (let i = 0; i < n; i++) {
      motes.push({
        x: Math.random() * W,
        y: Math.random() * groundY,
        r: 0.8 + Math.random() * 1.9,
        sp: 4 + Math.random() * 16,
        ph: Math.random() * TAU,
        a: 0.25 + Math.random() * 0.5
      });
    }
  }

  /* ----------------------------------------------------------- loop */
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = reduced ? 0 : (now - t0) / 1000;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);

    // clouds
    for (const c of clouds) {
      if (!reduced) c.x += c.speed * dt;
      if (c.x > W + 20) c.x = -c.w - 20;
      ctx.globalAlpha = c.alpha;
      ctx.drawImage(c.img, c.x, c.y, c.w, c.h);
    }
    ctx.globalAlpha = 1;

    // growth
    for (const f of flowers) {
      if (reduced) { f.t = 1; continue; }
      if (f.delay > 0) f.delay -= dt;
      else f.t = Math.min(1, f.t + dt / 4.2);
    }

    ctx.save();
    for (const b of grassBack) drawBlade(b, t);
    for (const f of flowers) drawFlower(f, t);
    for (const b of grassFront) drawBlade(b, t);
    ctx.restore();

    // pollen drifting over everything above ground
    for (const m of motes) {
      if (!reduced) {
        m.x += (m.sp + windAt(m.x, t) * 22) * dt;
        m.y += Math.sin(t * 0.8 + m.ph) * 6 * dt;
        if (m.x > W + 6) m.x = -6;
        if (m.y < 0) m.y = groundY;
      }
      ctx.globalAlpha = m.a * (0.55 + 0.45 * Math.sin(t * 2 + m.ph));
      ctx.fillStyle = '#fff4c0';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // vignette keeps the eye on the centre of the cut
    const vg = ctx.createRadialGradient(W / 2, groundY * 0.85, Math.min(W, H) * 0.25,
                                        W / 2, groundY * 0.85, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(24,14,6,.3)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  /* --------------------------------------------------------- setup */
  function layout() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    const portrait = H >= W;
    groundY = Math.round(H * (portrait ? 0.52 : 0.58));
    soilH = H - groundY;
    paintBackground();
    seedClouds();
    seedGrass();
    seedMotes();
  }

  function replant() {
    seedFlowers();
    if (reduced) flowers.forEach(f => { f.t = 1; f.delay = 0; });
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const prev = flowers.map(f => f.x / Math.max(1, W));
      layout();
      // keep the plants, re-anchor them to the new width
      flowers.forEach((f, i) => {
        f.x = (prev[i] ?? Math.random()) * W;
        f.base = groundY + (f.depth - 1) * 10;
      });
      if (!flowers.length) replant();
    }, 160);
  });

  cv.addEventListener('pointerdown', e => {
    const x = e.clientX;
    if (flowers.length > 42) flowers.shift();
    const f = makeFlower(x, 0, (Math.random() * 1e6) | 0);
    if (reduced) f.t = 1;
    flowers.push(f);
    flowers.sort((a, b) => a.depth - b.depth);
    hintEl.classList.add('gone');
  });

  document.getElementById('replant').addEventListener('click', () => {
    replant();
    hintEl.classList.remove('gone');
    setTimeout(() => hintEl.classList.add('gone'), 6000);
  });

  layout();
  replant();
  setTimeout(() => hintEl.classList.add('gone'), 7000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
